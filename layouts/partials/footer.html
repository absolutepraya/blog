{{/* Mermaid support — loaded only when a page uses mermaid code blocks */}}
{{ if .Page.Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';

  function getMermaidTheme() {
    var isDark = document.documentElement.classList.contains('dark-theme');
    return {
      startOnLoad: false,
      theme: 'base',
      themeVariables: isDark ? {
        primaryColor: '#073642',
        primaryTextColor: '#93a1a1',
        primaryBorderColor: '#586e75',
        lineColor: '#586e75',
        secondaryColor: '#002b36',
        tertiaryColor: '#073642',
        background: '#002b36',
        mainBkg: '#073642',
        nodeBorder: '#586e75',
        clusterBkg: '#073642',
        clusterBorder: '#586e75',
        titleColor: '#93a1a1',
        edgeLabelBackground: '#073642',
        nodeTextColor: '#93a1a1',
        actorTextColor: '#93a1a1',
        actorLineColor: '#586e75',
        signalColor: '#93a1a1',
        signalTextColor: '#93a1a1',
        labelBoxBkgColor: '#073642',
        labelBoxBorderColor: '#586e75',
        labelTextColor: '#93a1a1',
        loopTextColor: '#93a1a1',
        noteBkgColor: '#073642',
        noteBorderColor: '#586e75',
        noteTextColor: '#93a1a1',
        sectionBkgColor: '#073642',
        altSectionBkgColor: '#002b36',
        sectionBkgColor2: '#073642',
        taskBorderColor: '#586e75',
        taskBkgColor: '#073642',
        taskTextColor: '#93a1a1',
        activeTaskBorderColor: '#268bd2',
        activeTaskBkgColor: '#073642',
        gridColor: '#586e75',
        doneTaskBkgColor: '#586e75',
        doneTaskBorderColor: '#93a1a1',
        critBorderColor: '#dc322f',
        critBkgColor: '#073642',
        todayLineColor: '#dc322f',
        fontFamily: '"Ubuntu", sans-serif'
      } : {
        primaryColor: '#eee8d5',
        primaryTextColor: '#586e75',
        primaryBorderColor: '#93a1a1',
        lineColor: '#93a1a1',
        secondaryColor: '#fdf6e3',
        tertiaryColor: '#eee8d5',
        background: '#fdf6e3',
        mainBkg: '#eee8d5',
        nodeBorder: '#93a1a1',
        clusterBkg: '#eee8d5',
        clusterBorder: '#93a1a1',
        titleColor: '#586e75',
        edgeLabelBackground: '#eee8d5',
        nodeTextColor: '#586e75',
        actorTextColor: '#586e75',
        actorLineColor: '#93a1a1',
        signalColor: '#586e75',
        signalTextColor: '#586e75',
        labelBoxBkgColor: '#eee8d5',
        labelBoxBorderColor: '#93a1a1',
        labelTextColor: '#586e75',
        loopTextColor: '#586e75',
        noteBkgColor: '#eee8d5',
        noteBorderColor: '#93a1a1',
        noteTextColor: '#586e75',
        sectionBkgColor: '#eee8d5',
        altSectionBkgColor: '#fdf6e3',
        sectionBkgColor2: '#eee8d5',
        taskBorderColor: '#93a1a1',
        taskBkgColor: '#eee8d5',
        taskTextColor: '#586e75',
        activeTaskBorderColor: '#268bd2',
        activeTaskBkgColor: '#eee8d5',
        gridColor: '#93a1a1',
        doneTaskBkgColor: '#93a1a1',
        doneTaskBorderColor: '#586e75',
        critBorderColor: '#dc322f',
        critBkgColor: '#eee8d5',
        todayLineColor: '#dc322f',
        fontFamily: '"Ubuntu", sans-serif'
      }
    };
  }

  function renderMermaid() {
    mermaid.initialize(getMermaidTheme());
    mermaid.run();
  }

  renderMermaid();

  // Re-render on dark mode toggle
  var toggle = document.getElementById('dark-mode-toggle');
  if (toggle) {
    toggle.addEventListener('change', function() {
      // Reset mermaid so it can re-render
      document.querySelectorAll('.mermaid').forEach(function(el) {
        var code = el.getAttribute('data-original');
        if (!code) {
          el.setAttribute('data-original', el.textContent || el.getAttribute('data-processed-content') || '');
        }
      });
      // Small delay to let the dark-theme class toggle
      setTimeout(function() {
        document.querySelectorAll('.mermaid[data-processed]').forEach(function(el) {
          var code = el.getAttribute('data-original');
          if (code) {
            el.removeAttribute('data-processed');
            el.innerHTML = code;
          }
        });
        mermaid.initialize(getMermaidTheme());
        mermaid.run();
      }, 50);
    });
  }
</script>
{{ end }}
