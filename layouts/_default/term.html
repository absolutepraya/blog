{{ define "main" }}
<section class="site-header">
    <h1 class="smallcap"><a class="site-title" href="/">~/abhipraya</a></h1>
    {{ partial "nav.html" . }}
</section>

<section class="site-intro">
    <p>Posts tagged "{{ .Title }}"</p>
</section>

<section class="home">
    <ul class="post-list">
        {{ range .Pages }}
        <li>
            <div class="post-title-container">
                <a href="{{ .Permalink }}" class="post-title-link">{{ .Title }}</a>
            </div>
            <time datetime="{{ .Date.Format "2006-01-02" }}" class="post-date">{{ .Date.Format "Jan 02, 2006" }}</time>
        </li>
        {{ end }}
    </ul>

    <p><a href="/">&larr; Back to all posts</a></p>
</section>

<hr>
<div class="copyright">
    <p>&copy; {{ now.Year }} Daffa Abhipraya | <a href="https://abhipraya.dev">Portfolio</a> | <a href="https://www.linkedin.com/in/absolutepraya/">LinkedIn</a></p>
</div>
{{ end }}
