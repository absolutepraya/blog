baseURL = "https://blog.abhipraya.dev/"
languageCode = "en-us"
title = "Daffa Abhipraya"
timeZone = "Asia/Jakarta"
copyright = "© Daffa Abhipraya"

[params]
  subtitle = "Thoughts on software, systems, and stuff"
  author = "Daffa Abhipraya"
  mainSections = ["posts"]
  showTagsOnHomepage = false
  showReadingProgress = false

[pagination]
  pagerSize = 10

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    lineNos = false
    lineNumbersInTable = true
    tabWidth = 4
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      linkify = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$'], ['\[', '\]']]
        inline = [['\(', '\)']]

[[menu.main]]
name = "About"
url = "/about"
weight = 1

[[menu.main]]
name = "Posts"
url = "/"
weight = 2

