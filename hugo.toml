baseURL = "https://blog.abhipraya.dev/"
languageCode = "en-us"
title = "Abhipraya"
theme = "archie-solarized"
copyright = "© Daffa Abhipraya"

[params]
  subtitle = "Thoughts on software, systems, and stuff"
  author = "Daffa Abhipraya"
  mainSections = ["posts"]

[pagination]
  pagerSize = 10

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    lineNos = false
    lineNumbersInTable = true
    tabWidth = 4
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      linkify = true

[[menu.main]]
name = "Posts"
url = "/posts"
weight = 1

[[menu.main]]
name = "About"
url = "/about"
weight = 2
