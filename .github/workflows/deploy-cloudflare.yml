name: Deploy Cloudflare blog

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-blog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.3'
          extended: true
      - run: npm ci
      - run: npm run test:social-cards
      - run: npm run test:feed
      - run: npm run build
      - name: Verify generated artifact
        run: |
          test -f public/index.html
          test -f public/404.html
          test -f public/index.xml
          test -f public/feed.json
          test -f public/sitemap.xml
          test -f public/robots.txt
          test -f public/_headers
          find public/social -type f -name '*.png' -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          retention-days: 1

  deploy-preview:
    name: Deploy preview
    needs: verify
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public
      - name: Deploy public preview
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: |
          set -o pipefail
          npx wrangler deploy --env preview --name abhipraya-blog-pr-${{ github.event.pull_request.number }} | tee deployment.log
          preview_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deployment.log | head -n 1)"
          test -n "$preview_url"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
      - name: Smoke-test preview
        run: node scripts/smoke-cloudflare-deployment.mjs "${{ steps.deploy.outputs.preview_url }}"
      - name: Publish preview URL
        run: |
          echo '## Cloudflare preview' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public
      - name: Deploy production Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
        run: npx wrangler deploy --env=""
      - name: Smoke-test production domain
        run: node scripts/smoke-cloudflare-deployment.mjs https://blog.abhipraya.dev --production

  delete-preview:
    name: Delete preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Delete closed pull-request preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: |
          account_id="$(node -e "const fs = require('fs'); const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8')); process.stdout.write(config.account_id)")"
          service="abhipraya-blog-pr-${{ github.event.pull_request.number }}"
          status="$(curl --silent --show-error --output /tmp/delete-preview.json --write-out '%{http_code}' --request DELETE \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/services/$service")"
          if [ "$status" = 200 ] || [ "$status" = 404 ]; then
            exit 0
          fi
          cat /tmp/delete-preview.json
          exit 1
